name: action

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        blocks: ['OFF', 'ON']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Check dependency selection
        run: python tests/test_selection.py

      - id: deps
        uses: ./
        with:
          target-gr-blocks: ${{ matrix.blocks }}

      - name: Check the prefix
        shell: bash
        env:
          BLOCKS: ${{ matrix.blocks }}
        run: |
          set -euo pipefail
          prefix="$GR_DEPS_PREFIX"
          test -f "$prefix/include/boost/ut.hpp"
          test -f "$prefix/include/httplib.h"
          find "$prefix" -name vir-simd-config.cmake | grep -q .
          # each blocks dependency, by a file its consumers look for: present exactly when selected
          check() {
            if [ "$BLOCKS" = ON ] && [ -z "$2" ]; then
              echo "::error::$1 was selected but not installed"; exit 1
            fi
            if [ "$BLOCKS" = OFF ] && [ -n "$2" ]; then
              echo "::error::$1 was not selected but is installed"; exit 1
            fi
          }
          check SoapySDR "$(find "$prefix" -name SoapySDRConfig.cmake)"
          check libzmq "$(find "$prefix" -name ZeroMQConfig.cmake)"
          check cppzmq "$(find "$prefix" -name cppzmqConfig.cmake)"
          check libsoundio "$(find "$prefix" -name libsoundioConfig.cmake)"

  # the same selection, after build has saved it, must be restored rather than rebuilt
  cached:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        blocks: ['OFF', 'ON']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - id: deps
        uses: ./
        with:
          target-gr-blocks: ${{ matrix.blocks }}

      - name: Check it was a cache hit
        shell: bash
        env:
          HIT: ${{ steps.deps.outputs.cache-hit }}
          KEY: ${{ steps.deps.outputs.cache-key }}
        run: |
          echo "cache key: $KEY"
          test "$HIT" = true
